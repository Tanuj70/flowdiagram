# Production-like stack: Postgres + API + Web.  Usage: cp .env.example .env && edit && docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: studio
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio"]
      interval: 5s
      retries: 10
  api:
    build: ./services/api
    depends_on:
      db: { condition: service_healthy }
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://studio:${POSTGRES_PASSWORD}@db:5432/studio
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (32+ random chars)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SEED_DEMO_DATA: "false"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:3000}
    expose: ["8000"]
  web:
    build:
      context: ./apps/web
      args: { API_URL: "http://api:8000" }
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  pgdata:
